version:
  # Keep these aligned with the historical OpenMP runtime markers rather than
  # inventing a package version that looks like a newer OpenMP specification.
  # The 5.1 GNU build exists because main already shipped 5.1_gnu. Build number
  # 52 supersedes the highest historical GNU build seen in main, including
  # linux-aarch64's 5.1-51_gnu, without forcing unrelated LLVM/Intel/MSVC
  # variants to 5.1.
  - 4.5      # [linux]
  - 5.1      # [linux]
  - 4.5      # [linux or osx or win]
  - 4.5      # [linux and x86_64]
  - 4.5      # [win and x86_64]
  - 2.0      # [win]

openmp_mutex_impl:
  # Zipped with version below to avoid rendering nonsensical combinations like
  # 5.1_llvm or 2.0_gnu.
  - gnu      # [linux]
  - gnu      # [linux]
  - llvm     # [linux or osx or win]
  - intel    # [linux and x86_64]
  - intel    # [win and x86_64]
  - msvc     # [win]

zip_keys:
  - - version
    - openmp_mutex_impl
